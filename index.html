<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expiration Date Checker</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 40px 20px;
        background: #f5f5f5;
        font-family: Arial, sans-serif;
    }

    .container {
        width: 100%;
        max-width: 400px;
        background: white;
        padding: 30px 25px;
        border-radius: 18px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.12);
    }

    h1 {
        text-align: center;
        margin: 0 0 25px;
        font-size: 28px;
    }

    .today {
        text-align: center;
        margin-bottom: 25px;
    }

    .today-label {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 5px;
    }

    .today-date {
        font-size: 26px;
    }

    .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 5px;
        border-top: 1px solid #ddd;
        font-size: 21px;
    }

    .days {
        font-weight: bold;
    }

    .date {
        font-weight: bold;
    }
</style>
</head>

<body>

<div class="container">

    <h1>Expiration Date</h1>

    <div class="today">
        <div class="today-label">TODAY</div>
        <div class="today-date" id="today"></div>
    </div>
<div class="row">
    <span class="days">7 DAYS</span>
    <span class="date" id="date7"></span>
</div>
    <div class="row">
        <span class="days">14 DAYS</span>
        <span class="date" id="date14"></span>
    </div>

    <div class="row">
        <span class="days">21 DAYS</span>
        <span class="date" id="date21"></span>
    </div>

    <div class="row">
        <span class="days">28 DAYS</span>
        <span class="date" id="date28"></span>
    </div>

    <div class="row">
        <span class="days">30 DAYS</span>
        <span class="date" id="date30"></span>
    </div>
   
    <div class="row">
    <span class="days">CUSTOM DAYS</span>
    <input
        type="number"
        id="customDays"
        placeholder="Days"
        min="1"
        style="width: 80px; font-size: 18px; padding: 6px;"
    >
    <span class="date" id="customDate"></span>
</div>
   
</div>

<script>
function formatDate(date, includeYear = false) {
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');

    if (includeYear) {
        const year = String(date.getFullYear()).slice(-2);
        return `${month}/${day}/${year}`;
    }

    return `${month}/${day}`;
}

function addDays(date, days) {
    const result = new Date(date);
    result.setDate(result.getDate() + days);
    return result;
}

const today = new Date();

document.getElementById("today").textContent =
    formatDate(today, true);
   
document.getElementById("date7").textContent =
    formatDate(addDays(today, 7));
   
document.getElementById("date14").textContent =
    formatDate(addDays(today, 14));

document.getElementById("date21").textContent =
    formatDate(addDays(today, 21));

document.getElementById("date28").textContent =
    formatDate(addDays(today, 28));

document.getElementById("date30").textContent =
    formatDate(addDays(today, 30));

 ldocument.getElementById("customDays").addEventListener("input", function() {
    const days = parseInt(this.value);

    if (days > 0) {
        document.getElementById("customDate").textContent =
            formatDate(addDays(today, days));
    } else {
        document.getElementById("customDate").textContent = "";
    }
});
</script>

</body>
</html>
